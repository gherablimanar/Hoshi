<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">توضيح CG وCP وهامش الاستقرار المرجعي</title><desc id="desc">مقدمة الصاروخ إلى اليسار. مركز الثقل قبل مركز الضغط في هذا الرسم التوضيحي، والمرجع x يزداد من المقدمة نحو الخلف. هذا ليس معيار قبول لتصميم معين.</desc>
